<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Mini-market</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <header class="auth-topbar">
    <a href="index.html" class="auth-brand">
      <span class="auth-brand-symbol">m<span>.</span></span>
      mini-market
    </a>
    <a href="login.html" class="auth-back">← Back to login</a>
  </header>

  <main class="auth-layout auth-wide">
    <section class="auth-card">
      <div class="auth-verification-icon">↗</div>
      <span class="auth-eyebrow">ACCOUNT RECOVERY</span>
      <h2>Forgot your password?</h2>
      <p class="auth-card-subtitle">Enter your account email. Once connected, we'll use Supabase to send you a secure password reset link.</p>

      <form class="auth-form" data-auth-form="forgot">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="auth-message" role="status" aria-live="polite"></div>
        <button class="auth-submit" type="submit">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Return to login</a></p>
    </section>
  </main>

  <footer class="auth-footer">© <span id="year"></span> Mini-market · Made for Malawi 🇲🇼</footer>
  <script src="js/auth.js"></script>
</body>
</html>
